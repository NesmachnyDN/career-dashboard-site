<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Карьерный центр</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="unlock" class="unlock hidden">
    <form id="unlock-form" class="unlock-card">
      <div class="eyebrow">ЛИЧНЫЙ КАРЬЕРНЫЙ ЦЕНТР</div>
      <h1>Карьерный центр</h1>
      <p>Данные зашифрованы. Введите парольную фразу — расшифровка выполняется только в этом браузере.</p>
      <input id="passphrase" type="password" autocomplete="current-password" placeholder="Парольная фраза" required />
      <button type="submit" class="primary">Открыть</button>
      <div id="unlock-error" class="error"></div>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">КЦ</span><span>Карьера</span></div>
      <nav id="nav">
        <button data-view="today" class="active">Сегодня</button>
        <button data-view="vacancies">Все вакансии</button>
        <button data-view="opportunities">Отклики / контакты</button>
        <button data-view="content">Контент</button>
        <button data-view="inbox">Почта</button>
        <button data-view="analytics">Аналитика</button>
        <button data-view="runs">Запуски</button>
      </nav>
      <div class="sidebar-foot"><span id="generated-at"></span></div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <div class="eyebrow">КАРЬЕРНЫЙ ЦЕНТР</div>
          <h1 id="view-title">Сегодня</h1>
        </div>
        <input id="search" type="search" placeholder="Поиск…" />
      </header>
      <section id="view"></section>
    </main>
  </div>

  <template id="empty-template">
    <div class="empty">Здесь пока нет данных.</div>
  </template>
  <script src="app.js" defer></script>
</body>
</html>
